worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    map $http_x_forwarded_proto $fcgi_https {
        default "";
        https on;
    }

    server {
        listen ${PORT};
        server_name _;
        root /var/www/wildlife/public_html;
        index index.php;
        autoindex off;
        client_max_body_size 10m;

        location = /admin {
            return 301 /admin/;
        }

        location ^~ /admin/ {
            try_files $uri @laravel;
        }

        location = /tickets {
            try_files $uri @laravel;
        }

        location /tickets/ {
            try_files $uri @laravel;
        }

        location = /bookings {
            try_files $uri @laravel;
        }

        location /bookings/ {
            try_files $uri @laravel;
        }

        location = /laravel/public {
            return 301 /laravel/public/;
        }

        location /laravel/public/ {
            rewrite ^/laravel/public/(.*)$ /$1 break;
            root /var/www/wildlife/laravel/public;
            try_files $uri @laravel;
        }

        location /assets/ {
            alias /var/www/wildlife/assets/;
        }

        location /uploads/tickets/ {
            alias /var/www/wildlife/laravel/public/uploads/tickets/;
        }

        location /uploads/ {
            alias /var/www/wildlife/uploads/;
        }

        location /images/ {
            alias /var/www/wildlife/laravel/public/images/;
        }

        location /storage/ {
            alias /var/www/wildlife/laravel/storage/app/public/;
        }

        location ~* ^/(laravel/public|assets|uploads|images|storage)/.*\.php(?:/|$) {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_HOST $host;
            fastcgi_param HTTPS $fcgi_https if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_pass 127.0.0.1:9000;
        }

        location @laravel {
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_FILENAME /var/www/wildlife/laravel/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $uri$is_args$args;
            fastcgi_param DOCUMENT_URI $uri;
            fastcgi_param DOCUMENT_ROOT /var/www/wildlife/laravel/public;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_param HTTP_HOST $host;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS $fcgi_https if_not_empty;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
